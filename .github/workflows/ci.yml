name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 23 项检查（类型 + 自检 + 护栏 + Rust）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 跑全量自检
        # check-all.ps1 会用仓库里的 node_modules/.bin，不依赖 npx
        run: pwsh -NoProfile -File tools/check-all.ps1

  mutation:
    # 变异检查要改源码再逐字节还原，慢（约 2 分钟），只在手动触发和合并到主分支时跑。
    name: 变异检查（64 条）
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 跑变异检查
        run: pwsh -NoProfile -File tools/mutation-check.ps1
