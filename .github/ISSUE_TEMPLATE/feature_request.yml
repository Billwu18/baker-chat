name: 功能建议
description: 想要一个现在没有的东西
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先看一眼 [README](../README.md) 的「已知问题」和 [CONTRIBUTING](../CONTRIBUTING.md) ——
        有些东西是**故意不做**的（比如加服务器、做公网穿透），提了也会被关掉。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先描述问题，再描述你想的方案。只有一个方案的 PR 通常会被问「为什么」。
      placeholder: 三个人在群里，我想知道是谁先看到某条消息的…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过但放弃的做法
      description: 这一栏很重要 —— 它能说明你确实想过权衡。

  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 这个建议不依赖服务器 / 公网 / 账号体系（本项目的定位是纯局域网）
          required: true
        - label: 这个建议不需要引入第三方游戏素材
          required: true
